name: Deploy to GitHub Pages

on:
  push:
    # The github-pages environment's deployment branch policy is pinned to
    # claude/pregnancy-care-planner-khcdua — the default branch at the moment
    # Pages was enabled. Deploys from main are rejected before a runner picks
    # them up (2s failure, no logs), so the old branch stays listed here and
    # is what actually publishes.
    #
    # To move fully to main: add main under Settings > Environments >
    # github-pages > Deployment branches and tags, then drop the old branch
    # from this list.
    branches: [main, claude/pregnancy-care-planner-khcdua]
  workflow_dispatch:

# Least privilege the Pages deployment needs: read the repo, publish the
# artifact, and mint the OIDC token deploy-pages authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-deployed
# Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck separately: vite build does not typecheck, so without this a
      # type error would deploy silently.
      - run: npm run typecheck

      - run: npm run build

      # Pages must already be enabled with Source: GitHub Actions in repository
      # settings. enablement: true does not work here — creating a Pages site
      # needs admin rights that GITHUB_TOKEN does not have, so it fails with
      # "Resource not accessible by integration".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
